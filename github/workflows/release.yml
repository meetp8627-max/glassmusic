name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, e.g. 2.1.0'
        required: true
      draft:
        description: 'Create as a draft first (recommended, so you can test)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle -p glasmio-edition :app:assembleRelease --no-daemon
          -PappVersionName=${{ inputs.version }}
          -PappVersionCode=${{ github.run_number }}

      - name: Collect files
        run: |
          mkdir out
          cp glasmio-edition/app/build/outputs/apk/release/*.apk "out/GlassMusic-v${{ inputs.version }}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo "## GlassMusic ${{ inputs.version }}"
            echo
            echo "Download the APK below and install it. Requires Android 13 or newer."
            echo "Checksums are in SHA256SUMS.txt."
            if [ "$SIGNED" = "no" ]; then
              echo
              echo "Note: this build used a temporary signing key. Uninstall older versions before installing."
            fi
          } > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ inputs.draft }}" = "true" ]; then flags="--draft"; fi
          gh release create "v${{ inputs.version }}" out/* \
            --title "GlassMusic ${{ inputs.version }}" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            $flags
