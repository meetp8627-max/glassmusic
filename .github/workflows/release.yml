name: Release

# Publishes a GitHub Release with ready-to-install APKs.
# Runs automatically when:
#   - the version in glasmio-edition/app/build.gradle.kts changes on main,
#   - a version tag such as v2.2.0 is pushed, or
#   - you start it by hand (Actions > Release > Run workflow).
# If a release for that version already exists, nothing happens.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths: ['glasmio-edition/app/build.gradle.kts']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 2.2.0 (leave empty to use the version in the project)'
        required: false
        default: ''
      draft:
        description: 'Publish as a draft instead of publicly'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(grep 'appVersionName' glasmio-edition/app/build.gradle.kts | grep -oP '\?: "\K[^"]+' | head -1)
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Could not find a valid version (got '$V')."
            exit 1
          fi
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-app:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build GlassMusic (Android 13+)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle -p glasmio-edition :app:assembleRelease --no-daemon
          -PappVersionName="$VERSION"
          -PappVersionCode="$(( ${{ github.run_number }} + 100 ))"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-app
          path: glasmio-edition/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-classic:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build GlassMusic Classic (Android 8+)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle :app:assembleRelease --no-daemon
          -PappVersionName="${VERSION}-classic"
          -PappVersionCode="$(( ${{ github.run_number }} + 100 ))"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-classic
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    needs: [prepare, build-app, build-classic]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      WANT_DRAFT: ${{ inputs.draft }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: apk-app
          path: dl/app

      - uses: actions/download-artifact@v4
        with:
          name: apk-classic
          path: dl/classic

      - name: Verify and rename the APKs
        run: |
          set -e
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          mkdir out
          cp dl/app/*.apk out/GlassMusic.apk
          cp dl/classic/*.apk out/GlassMusic-Classic.apk
          for f in out/GlassMusic.apk out/GlassMusic-Classic.apk; do
            test -s "$f"
            if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify "$f"; fi
          done
          (cd out && sha256sum GlassMusic.apk GlassMusic-Classic.apk > SHA256SUMS.txt)

      - name: Write the release notes
        run: |
          PREV=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          python3 scripts/release_notes.py \
            --version "$VERSION" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --prev "$PREV" --out notes.md
          cat notes.md

      - name: Publish the release
        run: |
          DRAFT=false
          if [ "$WANT_DRAFT" = "true" ] || [ "$HAS_KEY" != "true" ]; then DRAFT=true; fi
          flags=()
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); elif [ "$DRAFT" = "false" ]; then flags+=(--latest); fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then flags+=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" out/GlassMusic.apk out/GlassMusic-Classic.apk out/SHA256SUMS.txt \
            --title "GlassMusic $VERSION" --notes-file notes.md "${flags[@]}"
          {
            echo "### Release $TAG"
            gh release view "$TAG" --json url -q .url
            if [ "$HAS_KEY" != "true" ]; then
              echo
              echo "Signing secrets are missing, so this release was saved as a **draft**. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions, then run this workflow again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
