name: Build GlassMusic 2.x

on:
  push:
    branches: ['**']
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack an uploaded zip (if there is one)
        id: unpack
        run: |
          z=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -n "$z" ]; then
            rm -rf /tmp/gm && mkdir /tmp/gm
            unzip -q -o "$z" -d /tmp/gm
            src=$(dirname "$(find /tmp/gm -maxdepth 2 -name settings.gradle.kts | head -1)")
            rsync -a --exclude='.git' --exclude='.github' "$src"/ ./
            git rm -q -f "$z"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Apply uploaded zip" || true
            git push || true
            echo "applied=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build GlassMusic 2.x
        run: gradle -p glasmio-edition :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GlassMusic-2.x-debug-apk
          path: glasmio-edition/app/build/outputs/apk/debug/*.apk

      - name: Start a release when the version is new
        if: steps.unpack.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep 'appVersionName' glasmio-edition/app/build.gradle.kts | grep -oP '\?: "\K[^"]+' | head -1)
          if [ -n "$V" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "New version $V - starting the release workflow."
            gh workflow run release.yml -f version="$V"
          else
            echo "Version $V already released (or not found). No release started."
          fi
